#:schema node_modules/wrangler/config-schema.json
name = "aheed-store"
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# Worker CPU execution limits (raise from default 10ms to prevent Error 1102 on SSR cold starts)
[limits]
cpu_ms = 50

# P7d (#218) — Workers Logs. Until this block existed there was no way to take a
# server-side latency measurement at all, while specs/mission.md sets API p95 < 400ms as a
# Gate-3 acceptance criterion. Inheritable, so staging and production both pick it up.
#
# head_sampling_rate = 1 means 100% of requests are logged. That is the right setting at
# today's pre-launch traffic (staging plus a handful of production requests) because a
# sampled log cannot answer "what happened on that one broken request". REVISIT BEFORE
# LAUNCH: at mission.md's ~1,000 orders/day plus browse traffic this will consume the
# Workers Logs daily quota, and the sampling rate should come down rather than the block
# being removed. Live tail (`wrangler tail`) is independent of this setting and always works;
# what this enables is *persisted*, queryable logs.
[observability]
enabled = true
head_sampling_rate = 1

# Static assets produced by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ---- Staging -------------------------------------------------------------
[env.staging]
name = "aheed-store-staging"

[[env.staging.routes]]
pattern = "staging.aheedfoodcentre.nocaped.com"
custom_domain = true

# ADR-004 slice 3b — SriMart, a 2nd vendor resolved by host (VendorDomain). This staging
# host must be declared here so `wrangler deploy` doesn't tear down the custom domain.
[[env.staging.routes]]
pattern = "srimart-staging.nocaped.com"
custom_domain = true

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "aheed-images-staging"

# ---- Production ----------------------------------------------------------
[env.production]
name = "aheed-store-production"

[[env.production.routes]]
pattern = "aheedfoodcentre.nocaped.com"
custom_domain = true

# ADR-004 slice 3b — SriMart (2nd vendor) production host, resolved by host (VendorDomain).
[[env.production.routes]]
pattern = "srimart.nocaped.com"
custom_domain = true

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "aheed-images-production"

# NOTE: secrets (DATABASE_URL, S3_*, STRIPE_*, BETTER_AUTH_SECRET) are NOT set here.
# Add them per environment with:  wrangler secret put NAME --env staging|production
