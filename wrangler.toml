#:schema node_modules/wrangler/config-schema.json
name = "aheed-store"
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# Worker CPU execution limits (raise from default 10ms to prevent Error 1102 on SSR cold starts).
#
# 2026-08-13 (`7ad9f6c`): 10 -> 50, for exactly that reason.
# 2026-08-27 (#415): 50 -> 300. It still recurred at 50 — observed live on staging
# at 12:46:36Z (Ray ID a31b2e161d0a63c5). This is a CPU-time trip, not an
# application exception: DB latency does not count against it, but React SSR plus
# Prisma's WASM query-compiler instantiation on a COLD isolate genuinely does, and
# 50ms is not a reliable ceiling for that. The 50 having taken effect at all is
# what proves this account is not on the free plan's hard 10ms cap; paid Workers
# allow up to 30000ms, so 300 is still conservative. Raising the ceiling does not
# raise the bill on its own — Workers bills CPU actually used, not the limit.
[limits]
cpu_ms = 300

# P7d (#218) — Workers Logs. Until this block existed there was no way to take a
# server-side latency measurement at all, while specs/mission.md sets API p95 < 400ms as a
# Gate-3 acceptance criterion. Inheritable, so staging and production both pick it up.
#
# head_sampling_rate = 1 means 100% of requests are logged. That is the right setting at
# today's pre-launch traffic (staging plus a handful of production requests) because a
# sampled log cannot answer "what happened on that one broken request". REVISIT BEFORE
# LAUNCH: at mission.md's ~1,000 orders/day plus browse traffic this will consume the
# Workers Logs daily quota, and the sampling rate should come down rather than the block
# being removed. Live tail (`wrangler tail`) is independent of this setting and always works;
# what this enables is *persisted*, queryable logs.
[observability]
enabled = true
head_sampling_rate = 1

# Static assets produced by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# #1324 — job activity markers, written here and read by workers/scheduler so an
# idle store's 15-minute tick never wakes the database. LOCAL SIMULATION ONLY:
# `npm run preview` simulates this namespace on disk; no deploy reads it, because
# both deploy workflows pass `--env` and kv_namespaces is not inherited by an
# environment. The id is a placeholder, not a real namespace.
[[kv_namespaces]]
binding = "JOB_SIGNALS"
id = "local-job-signals"

# ---- Staging -------------------------------------------------------------
[env.staging]
name = "aheed-store-staging"

# #1323 — hosts live on merqify.com in the Merqify Cloudflare account (the Nocaped account dropped
# to Free and can no longer deploy). Flat names, because Universal SSL covers one subdomain level.
# The deploy target is CLOUDFLARE_ACCOUNT_ID in the GitHub environment; nothing here names it.
[[env.staging.routes]]
pattern = "aheed-staging.merqify.com"
custom_domain = true

# ADR-004 slice 3b — SriMart, a 2nd vendor resolved by host (VendorDomain). This staging
# host must be declared here so `wrangler deploy` doesn't tear down the custom domain.
[[env.staging.routes]]
pattern = "srimart-staging.merqify.com"
custom_domain = true

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "shoplocal-images-staging"

# #1324/#1325 — JOB_SIGNALS for staging: KV namespace `aheed-jobs-staging` in the Merqify account
# (created 2026-10-31). The SAME id is in both this file and the other wrangler.toml.
[[env.staging.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "20aab8dee7f342809679d36f1d96fc6c"

# #767/#771 — NOT a secret, just non-sensitive config, so it belongs in committed config rather
# than a dashboard-only binding. A dashboard-added plain-text var (no `[vars]` entry, no
# `wrangler secret put`) does NOT survive the next `wrangler deploy`: deploy rebuilds a Worker's
# `vars` set entirely from this file, while secrets persist independently. That silently wiped
# this exact variable between this slice's Build and its own Validate (CLAUDE.md, Config &
# secrets) — a `[vars]` entry here is what makes it durable.
[env.staging.vars]
UK_LOCATION_REF_POSTCODE_AREAS = "MK,RG"
# #1055 — the storefront footer's "Powered by" line: the platform's name and tagline. lib/config.ts
# falls back to the same two values when unset. Non-secret config, so it lives here (see above).
PLATFORM_NAME = "Merqify"
PLATFORM_TAGLINE = "Your Merchandise, Digitised Quickly"
# #1217 — the platform sender every provider uses when a vendor's own domain is not yet verified.
EMAIL_FROM = "no-reply@merqify.com"
# EMAIL_RECIPIENT_MODE is deliberately UNSET on staging (owner, 2026-11-10, #1482; reverses #1459):
# unset means allowlist, so staging only ever mails the EMAIL_ALLOWED_RECIPIENTS secret and can never
# reach a real customer by accident. Only the production envs set "open"
# (tests/staging-email-allowlist.test.ts).
# #1399 — the platform default inbox, prefilled as Forward to in Client Setup. A business group
# inbox, not a personal address, so committed config. The inbound Worker's INBOUND_FALLBACK_FORWARD
# secret names the same inbox by convention; it must be a verified Email Routing destination.
INBOUND_DEFAULT_FORWARD = "info-merqifyhub@googlegroups.com"
# #1409 — names this deployment, so outgoing subjects are tagged [STAGING]. Unset means [DEV].
APP_ENV = "staging"

# #1217 — Cloudflare Email Service. The binding is the credential: no API key secret.
[[env.staging.send_email]]
name = "EMAIL"

# ---- Production ----------------------------------------------------------
[env.production]
name = "aheed-store-production"

[[env.production.routes]]
pattern = "aheed.merqify.com"
custom_domain = true

# ADR-004 slice 3b — SriMart (2nd vendor) production host, resolved by host (VendorDomain).
[[env.production.routes]]
pattern = "srimart.merqify.com"
custom_domain = true

# #1482 phase B — the Cloudflare for SaaS FALLBACK ORIGIN: every custom hostname that names no origin
# of its own (merqify.com → SSL/TLS → Custom Hostnames, Origin server left as default) reaches this
# Worker. It belongs here because this Worker holds several vendors: an unmatched host resolves to no
# vendor (lib/tenant.ts) and is sent to /coming-soon, so the fallback can never show one client's
# store under another client's hostname. Never route it to a single-vendor cell (afc-*), where every
# unmatched host resolves to that cell's one vendor — tests/worker-routes.test.ts enforces both.
# Not a vendor host: scripts/verify-worker-routes.ts skips it (SAAS_ORIGIN_HOSTS).
[[env.production.routes]]
pattern = "fallback.merqify.com/*"
zone_name = "merqify.com"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "shoplocal-images-production"

# #1324/#1325 — JOB_SIGNALS for production: KV namespace `aheed-jobs-production` in the Merqify account
# (created 2026-10-31). The SAME id is in both this file and the other wrangler.toml.
[[env.production.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "ba3dd6efb50445bc9cf856664fe6c1c5"

# See the identical [env.staging.vars] block above for why this is committed config rather than
# a dashboard binding.
#
# #955 — SEO_INDEXABLE appears HERE AND NOWHERE ELSE, and that asymmetry is the feature, not an
# omission. `app/robots.ts` serves `Allow: /` only when this is exactly "true", so staging and
# local stay non-indexable by being unconfigured rather than by naming a host (which is what
# de-indexed every vendor but the first). Adding it to [env.staging.vars] would publish staging to
# search engines.
[env.production.vars]
UK_LOCATION_REF_POSTCODE_AREAS = "MK,RG"
SEO_INDEXABLE = "true"
PLATFORM_NAME = "Merqify"
PLATFORM_TAGLINE = "Your Merchandise, Digitised Quickly"
# #1217 — see the staging block. "open" HERE AND NOWHERE ELSE: only production mails arbitrary
# recipients.
EMAIL_FROM = "no-reply@merqify.com"
EMAIL_RECIPIENT_MODE = "open"
# #1399 — see the staging block.
INBOUND_DEFAULT_FORWARD = "info-merqifyhub@googlegroups.com"
# #1409 — production subjects are never tagged.
APP_ENV = "production"

[[env.production.send_email]]
name = "EMAIL"

# ---- Aheed Food Centre Dedicated Cell (Staging) -------------------------
# #1331 — Dedicated cell for Aheed Food Centre at staging.aheedfoodcentre.co.uk
[env.afc-staging]
name = "afc-store-staging"

[[env.afc-staging.routes]]
pattern = "staging.aheedfoodcentre.co.uk/*"
zone_name = "merqify.com"

# #1482 — this Worker's own ORIGIN for Cloudflare for SaaS. The custom hostname
# staging.aheedfoodcentre.co.uk (merqify.com zone → SSL/TLS → Custom Hostnames) must name this as its
# Origin server and Origin SNI. Its origin had been aheed-staging.merqify.com — the PLATFORM staging
# Worker's custom domain — so staging traffic reached the platform Worker (platform DB, platform
# Google client) whenever no route above intercepted it, as on 2026-11-10. A custom domain cannot be
# taken by another Worker, so this pins the hostname to the AFC Worker. Not a vendor host: no
# VendorDomain row; scripts/verify-worker-routes.ts skips it (SAAS_ORIGIN_HOSTS).
[[env.afc-staging.routes]]
pattern = "afc-staging-origin.merqify.com"
custom_domain = true

[[env.afc-staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "afc-images-staging"

# #1491 — the AFC cell's OWN namespace (afc-jobs-staging). It had reused the platform staging id, so the
# two cells overwrote each other's job markers and warm-up schedule. Same id in both wrangler.toml files.
[[env.afc-staging.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "9b5c84f21e294e1ca00b78bb1af62328"

[env.afc-staging.vars]
UK_LOCATION_REF_POSTCODE_AREAS = "MK,RG"
PLATFORM_NAME = "Aheed Food Centre"
PLATFORM_TAGLINE = "Independent Quality Groceries"
EMAIL_FROM = "no-reply@merqify.com"
# EMAIL_RECIPIENT_MODE deliberately unset: allowlist (see [env.staging.vars], #1482).
INBOUND_DEFAULT_FORWARD = "info-afc@googlegroups.com"
APP_ENV = "staging"

[[env.afc-staging.send_email]]
name = "EMAIL"

# ---- Aheed Food Centre Dedicated Cell (Production) ----------------------
# #1331 — Dedicated cell for Aheed Food Centre at www.aheedfoodcentre.co.uk
[env.afc-production]
name = "afc-store-production"

[[env.afc-production.routes]]
pattern = "www.aheedfoodcentre.co.uk/*"
zone_name = "merqify.com"

# #1482 — production's counterpart of afc-staging-origin.merqify.com: this Worker's own ORIGIN for
# Cloudflare for SaaS. The www.aheedfoodcentre.co.uk custom hostname names it as Origin server and Origin
# SNI, and the Aheed zone's www CNAME points at it (both confirmed 2026-11-11). Not a vendor host: no
# VendorDomain row; scripts/verify-worker-routes.ts skips it (SAAS_ORIGIN_HOSTS).
#
# This Worker deliberately does NOT route fallback.merqify.com/* (removed 2026-11-11). The SaaS fallback
# origin serves every custom hostname that names no origin of its own, and this cell holds exactly one
# vendor, so lib/tenant.ts resolves ANY unmatched host to Aheed: another client's hostname on the
# fallback would have shown Aheed's store. The fallback belongs to the multi-vendor platform Worker,
# where an unmatched host resolves to no vendor and gets /coming-soon ([env.production], phase B).
[[env.afc-production.routes]]
pattern = "afc-origin.merqify.com"
custom_domain = true

[[env.afc-production.r2_buckets]]
binding = "IMAGES"
bucket_name = "afc-images-production"

# #1491 — the AFC cell's OWN namespace (afc-jobs-production); see afc-staging above.
[[env.afc-production.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "21b5000fa6c34de09e644599d3d103f7"

[env.afc-production.vars]
UK_LOCATION_REF_POSTCODE_AREAS = "MK,RG"
SEO_INDEXABLE = "true"
PLATFORM_NAME = "Aheed Food Centre"
PLATFORM_TAGLINE = "Independent Quality Groceries"
EMAIL_FROM = "no-reply@merqify.com"
EMAIL_RECIPIENT_MODE = "open"
INBOUND_DEFAULT_FORWARD = "info-afc@googlegroups.com"
APP_ENV = "production"

[[env.afc-production.send_email]]
name = "EMAIL"

# NOTE: secrets (DATABASE_URL, UK_LOCATION_REF_DATABASE_URL, S3_*, STRIPE_*, BETTER_AUTH_SECRET)
# are NOT set here. Add them per environment with:  wrangler secret put NAME --env <env>
