name: deploy-docs-internal
on:
  push:
    branches: [staging, main]

# Unlike the storefront app, the internal KMS site has no staging/production split — it's one
# "internal" audience regardless of branch, so either branch triggers the same deploy.
#
# LIVE, AND GATED BY CLOUDFLARE ACCESS — not "no public route". This comment said the opposite
# until 2026-10-16, long after the route went live: kms/site-internal/wrangler.toml carries an
# uncommented [[routes]] block for docs.internal.aheedfoodcentre.nocaped.com with
# custom_domain = true, annotated LIVE (2026-08-08). Read that file, not this comment, and keep
# the two in step.
#
# Access IS this site's only auth — it has no application-level auth of its own, and it serves
# internal content (ADRs, CLAUDE.md, operator runbooks). Verified unauthenticated on 2026-10-16:
# both the root and a deep link (/dev/runbook/local-dev-playbook) 302 to
# nocaped.cloudflareaccess.com with auth_status NONE, and no document content leaks through.
# Re-check the deep link, not only "/", after any Access policy change — a policy scoped to the
# root alone would leave every document directly reachable.
#
# workers_dev stays false: a deployed Worker gets a public *.workers.dev URL by default,
# which Access does NOT gate. If the Access application is ever removed, re-comment the route in
# the same change. See kms/site-internal/README.md.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging # CLOUDFLARE_API_TOKEN/ACCOUNT_ID are account-level, same across envs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Install root deps (needed for kms/scripts/assemble.ts)
        run: npm ci

      - name: Assemble internal content from single-source docs
        run: npm run kms:assemble:internal

      - name: Install site-internal deps
        run: npm ci
        working-directory: kms/site-internal

      - name: Build (OpenNext) & deploy to Workers
        run: npx opennextjs-cloudflare build && npx wrangler deploy
        working-directory: kms/site-internal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
