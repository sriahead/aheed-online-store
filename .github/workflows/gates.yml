name: gates
on:
  pull_request:
    branches: [staging, main]

jobs:
  # The five shared checks live in quality.yml so `deploy-production` runs the exact
  # same set (P9.2, #435). Do not re-add them here — two copies drift.
  quality:
    uses: ./.github/workflows/quality.yml

  # PR-only gates. Both need `github.base_ref` to diff against, which a push event
  # does not have, so these cannot move into the reusable workflow.
  docs-gates:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: KMS — front-matter validation
        run: npm run kms:validate
      - name: KMS — ARTIFACT_INDEX.md staleness check
        run: |
          cp ARTIFACT_INDEX.md /tmp/artifact-index-before.md
          npm run kms:build-index
          normalize() { sed -E 's/Last build: `[^`]+`/Last build: TS/; s/commit `[^`]+`/commit SHA/' "$1"; }
          if ! diff <(normalize /tmp/artifact-index-before.md) <(normalize ARTIFACT_INDEX.md) > /tmp/artifact-index.diff; then
            echo "::error::ARTIFACT_INDEX.md is stale — run 'npm run kms:build-index' and commit the result."
            cat /tmp/artifact-index.diff
            exit 1
          fi
          echo "ARTIFACT_INDEX.md is current ✓"
      - name: Gate 4 — CHANGELOG updated on this branch
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated ✓"
          else
            echo "::error::Gate 4 failed — CHANGELOG.md was not updated on this branch."
            exit 1
          fi
