name: pricing-review

# #1309 — quarterly reminder to review platform costs, competitor pricing and the business model.
#
# It runs scripts/pricing-review.ts, which reads only the pure registries under lib/ (no database, no
# network, no AI, no credential), and opens ONE issue with the result. The AI-assisted comparison with
# live pricing pages is the "Refresh Recommendations" button on /staff/platform/costs, pressed by a
# person; running that here would need Cloudflare credentials in an unattended job that reads untrusted
# web pages. The only token used is GITHUB_TOKEN.
#
# Like every schedule/workflow_dispatch workflow, this does nothing until it reaches main.

on:
  schedule:
    # 06:00 UTC on the first day of January, April, July and October.
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the review body
        run: npx tsx scripts/pricing-review.ts > "$RUNNER_TEMP/pricing-review.md"
      - name: Open the review issue unless one is already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          quarter=$(( ( $(date -u +%-m) - 1 ) / 3 + 1 ))
          title="Quarterly pricing review $(date -u +%Y)-Q${quarter}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" != "0" ]; then
            echo "An open issue titled '$title' already exists; not opening another."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/pricing-review.md"
