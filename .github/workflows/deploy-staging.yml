name: deploy-staging
on:
  push:
    branches: [staging]

jobs:
  # #539 — the staging deploy path runs the same checks a pull request runs.
  #
  # This job used to be absent, on the reasoning that `gates` had already run lint, format,
  # typecheck and test on the PR that produced the merge. That reasoning was sound and its
  # premise was unenforced: `gates` triggers `on: pull_request`, and until #539 no ruleset
  # covered `staging` at all (`protect-main`'s condition is `~DEFAULT_BRANCH`, which is `main`
  # and nothing else). A commit pushed straight to `staging` therefore reached build, migrate
  # and deploy having run no check of any kind.
  #
  # Both halves of that are now closed. The `protect-staging` repository ruleset requires a
  # pull request into `staging`, so `gates` cannot be skipped; this job additionally catches
  # the case a ruleset cannot — a PR whose checks went red and was merged anyway. Neither
  # subsumes the other.
  quality:
    uses: ./.github/workflows/quality.yml
    # Same split `deploy-production.yml` uses, for the same reason: by the time this runs the
    # content has already merged, so failing the deploy cannot un-merge a stale generated
    # artefact — it only withholds whatever fix this push carries. The failure still surfaces
    # as a red `kms` job and `::error::` annotations. The `quality` job itself stays blocking,
    # so lint, format, typecheck and tests do gate the deploy.
    with:
      kms_blocking: false

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    # #1509 — runs for the same Worker set QUEUE rather than overlap. Two merges a minute apart once ran
    # two deploys of one Worker at the same moment; the second's `wrangler secret put` failed because the
    # first had just uploaded a version. Not cancelled: an interrupted migrate or deploy is worse than
    # waiting. GitHub keeps one pending run per group, so a burst of merges still ends on the newest commit.
    concurrency:
      group: deploy-staging-platform
      cancel-in-progress: false
    environment: staging # uses GitHub 'staging' environment secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # P9.2 (#434) — build BEFORE migrating, same ordering as deploy-production. #434 names
      # only production, but staging carried the identical defect and is the rehearsal for
      # production: leaving it inverted means the environment that would normally surface this
      # can still end up migrated-but-not-built.
      # BOTH Prisma clients, before the build. @prisma/client's postinstall generates
      # only the default schema during `npm ci`; it has never known about
      # prisma/reference/schema.prisma, whose client is generated into node_modules
      # (see that schema's generator block for why it must live there). Without this
      # step the OpenNext build below fails to resolve @aheed/reference-client.
      #
      # No database is contacted — a Prisma client is generated from the schema file.
      # The URLs are supplied only because the datasource block requires the variables
      # to exist for the schema to parse.
      - name: Generate Prisma clients
        env:
          UK_LOCATION_REF_DATABASE_URL: ${{ secrets.UK_LOCATION_REF_DATABASE_URL }}
          UK_LOCATION_REF_DIRECT_URL: ${{ secrets.UK_LOCATION_REF_DIRECT_URL }}
        run: npm run db:generate

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Apply migrations (direct connection)
        run: npx prisma migrate deploy
        env:
          # migrate uses the DIRECT (unpooled) Neon URL; set both so schema env resolves
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      # #1198 — refuse to deploy a wrangler.toml that does not route a vendor currently trading in
      # THIS environment. A wrangler deploy that omits a host which already has a custom domain
      # tears that domain down, and nothing compared the file against VendorDomain before this.
      #
      # Deliberately here rather than in quality.yml, which CLAUDE.md otherwise requires: the check
      # needs this environment's DIRECT_URL, which a PR runner does not have, so there it could only
      # skip — and a skip line is not a pass. It must stay AFTER migrate (so VendorDomain is current)
      # and BEFORE the deploy below (the step that can destroy a domain).
      - name: Verify Worker routes cover every trading vendor
        run: npx tsx scripts/verify-worker-routes.ts --env staging
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      - name: Deploy to Workers
        run: |
          echo "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID --env staging
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | npx wrangler secret put CLOUDFLARE_API_TOKEN --env staging
          npx wrangler deploy --env staging --var "GIT_COMMIT_SHA:$(git rev-parse --short HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # P9.2 (#618) — the job scheduler is a SECOND Worker with its own config and
      # its own Cron Trigger. It exists because the OpenNext-generated application
      # entry exports only `fetch`, so a Cron Trigger has nothing to attach to.
      #
      # Ordered AFTER the application deploy deliberately: the scheduler's only
      # job is to call routes on the app, so deploying it first would schedule
      # calls against a bundle that does not serve them yet.
      #
      # JOB_INVOCATION_TOKEN is NOT set here — it is a runtime secret held on both
      # Workers and rotated with `wrangler secret put`, never through CI.
      - name: Deploy job scheduler
        run: npx wrangler deploy --config workers/scheduler/wrangler.toml --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # #1217 — the inbound-email Worker: Email Routing's target for store addresses. A THIRD
      # Worker for the same reason as the scheduler (the generated app entry has no `email`
      # export). After the app deploy, because it calls /api/inbound-email/resolve on it. Its two
      # secrets (INBOUND_EMAIL_TOKEN, INBOUND_FALLBACK_FORWARD) are set with `wrangler secret put`,
      # never through CI.
      - name: Deploy inbound email worker
        run: npx wrangler deploy --config workers/inbound-email/wrangler.toml --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # #1505 — the dedicated AFC cell deploys in its OWN job, in parallel with the platform's `deploy`.
  # Its steps used to run at the end of `deploy`, so any platform failure (build, migrate, route
  # check, wrangler) left Aheed undeployed, and Aheed's release always waited on ShopLocal's. Same
  # commit, same code, same `quality` gate: every platform change still reaches the cell, but neither
  # cell's failure blocks the other. Order inside the job is unchanged: build BEFORE migrating (#434),
  # migrate before the route check (#1198), app Worker before its scheduler and inbound-email Workers.
  deploy-afc:
    needs: quality
    runs-on: ubuntu-latest
    # #1509 — same queueing as `deploy`, in the cell's OWN group, so the two cells still run in parallel.
    concurrency:
      group: deploy-staging-afc
      cancel-in-progress: false
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Same as `deploy`: both Prisma clients from the schema files; no database is contacted.
      - name: Generate Prisma clients
        env:
          UK_LOCATION_REF_DATABASE_URL: ${{ secrets.UK_LOCATION_REF_DATABASE_URL }}
          UK_LOCATION_REF_DIRECT_URL: ${{ secrets.UK_LOCATION_REF_DIRECT_URL }}
        run: npm run db:generate

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Apply migrations to AFC dedicated cell (direct connection)
        if: env.AFC_DIRECT_URL != ''
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.AFC_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.AFC_DIRECT_URL }}
          AFC_DIRECT_URL: ${{ secrets.AFC_DIRECT_URL }}

      - name: Verify AFC Worker routes
        if: env.AFC_DIRECT_URL != ''
        run: npx tsx scripts/verify-worker-routes.ts --env afc-staging
        env:
          DIRECT_URL: ${{ secrets.AFC_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.AFC_DIRECT_URL }}
          AFC_DIRECT_URL: ${{ secrets.AFC_DIRECT_URL }}

      - name: Deploy AFC Dedicated Worker
        if: env.AFC_DIRECT_URL != ''
        run: |
          echo "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID --env afc-staging
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | npx wrangler secret put CLOUDFLARE_API_TOKEN --env afc-staging
          npx wrangler deploy --env afc-staging --var "GIT_COMMIT_SHA:$(git rev-parse --short HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AFC_DIRECT_URL: ${{ secrets.AFC_DIRECT_URL }}

      - name: Deploy AFC job scheduler
        if: env.AFC_DIRECT_URL != ''
        run: npx wrangler deploy --config workers/scheduler/wrangler.toml --env afc-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AFC_DIRECT_URL: ${{ secrets.AFC_DIRECT_URL }}

      - name: Deploy AFC inbound email worker
        if: env.AFC_DIRECT_URL != ''
        run: npx wrangler deploy --config workers/inbound-email/wrangler.toml --env afc-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AFC_DIRECT_URL: ${{ secrets.AFC_DIRECT_URL }}
