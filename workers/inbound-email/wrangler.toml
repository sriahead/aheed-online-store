#:schema ../../node_modules/wrangler/config-schema.json
#
# The inbound-email Worker (#1217) — Cloudflare Email Routing's target for every store address.
#
# Separate from the root wrangler.toml for the same reason as workers/scheduler: the application
# Worker's entry is generated by `opennextjs-cloudflare build` and exports only `fetch`, so it has
# no `email` export to route mail to. See workers/inbound-email/src/index.ts.
#
# This Worker has no database URL, no R2, no KV and no vendor knowledge. Its whole configuration is
# where to call, what secret to prove itself with, and where mail goes if the call fails.
#
# Routing is set up in the Cloudflare dashboard (Email Routing → Routing rules → "Send to a
# Worker"), one rule per store address, AFTER this Worker is deployed. Until then it receives
# nothing. Staging and production need different addresses: one address routes to one Worker.
name = "aheed-inbound-email"
main = "src/index.ts"
compatibility_date = "2025-03-25"

# ---- Staging -------------------------------------------------------------
[env.staging]
name = "aheed-inbound-email-staging"

[env.staging.vars]
APP_BASE_URL = "https://aheed-staging.merqify.com"

# ---- Production ----------------------------------------------------------
[env.production]
name = "aheed-inbound-email"

[env.production.vars]
APP_BASE_URL = "https://aheed.merqify.com"

# NOTE: two values are NOT set here, per environment, with `wrangler secret put … --config
# workers/inbound-email/wrangler.toml --env <env>`:
#   INBOUND_EMAIL_TOKEN       — the SAME value as on the application Worker (configure-env pushes
#                               it to both).
#   INBOUND_FALLBACK_FORWARD  — a mailbox verified as an Email Routing destination address; it
#                               receives mail whenever the application cannot be asked. A secret
#                               rather than a [vars] entry so no personal address is committed.
