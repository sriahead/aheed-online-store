#:schema ../../node_modules/wrangler/config-schema.json
#
# The job scheduler (P9.2, #618) — a Cron Trigger and an authenticated fetch.
#
# Separate from the root wrangler.toml because the application Worker's entry is
# generated by `opennextjs-cloudflare build` and exports only `fetch`; there is
# no `scheduled` export to attach a trigger to, and the generated file is
# overwritten by every build. See workers/scheduler/src/index.ts.
#
# This Worker has NO bindings: no R2, no database URL, no vendor knowledge. Its
# whole configuration is where to call and what secret to prove itself with.
name = "aheed-scheduler"
main = "src/index.ts"
compatibility_date = "2025-03-25"

# Every 15 minutes. The number being bought is recovery latency: a shopper who
# paid into a lost webhook sits with no confirmation email until a tick resolves
# them, and an hourly period would leave them there up to four times longer for
# no saving that matters at this volume.
[triggers]
crons = ["*/15 * * * *"]

# ---- Staging -------------------------------------------------------------
[env.staging]
name = "aheed-scheduler-staging"

[env.staging.triggers]
crons = ["*/15 * * * *"]

[env.staging.vars]
APP_BASE_URL = "https://staging.aheedfoodcentre.nocaped.com"

# ---- Production ----------------------------------------------------------
[env.production]
name = "aheed-scheduler-production"

[env.production.triggers]
crons = ["*/15 * * * *"]

[env.production.vars]
APP_BASE_URL = "https://aheedfoodcentre.nocaped.com"

# NOTE: JOB_INVOCATION_TOKEN is NOT set here. It is a runtime secret and must be
# set per environment, on BOTH this Worker and the application Worker, with the
# SAME value:
#   wrangler secret put JOB_INVOCATION_TOKEN --config workers/scheduler/wrangler.toml --env <env>
#   wrangler secret put JOB_INVOCATION_TOKEN --env <env>
