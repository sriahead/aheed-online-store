#:schema ../../node_modules/wrangler/config-schema.json
#
# The job scheduler (P9.2, #618) — a Cron Trigger and an authenticated fetch.
#
# Separate from the root wrangler.toml because the application Worker's entry is
# generated by `opennextjs-cloudflare build` and exports only `fetch`; there is
# no `scheduled` export to attach a trigger to, and the generated file is
# overwritten by every build. See workers/scheduler/src/index.ts.
#
# This Worker has no database URL, no R2 and no vendor knowledge. Its only
# binding is the JOB_SIGNALS KV namespace (#1324), read to decide whether a tick
# has anything to do; the rest of its configuration is where to call and what
# secret to prove itself with.
name = "aheed-scheduler"
main = "src/index.ts"
compatibility_date = "2025-03-25"

# Every 15 minutes, GATED (#1324): a tick calls a job only when its KV marker
# says there is work, so an idle store never wakes the database. The number the
# 15 minutes buys is recovery latency for a shopper who paid into a lost webhook.
# Plus `0 3 * * *`: the daily ungated run, which calls every job whatever the
# markers say and is the only run of the guest-cart reaper.
# Plus `*/4 * * * *` (#1491): the database warm-up tick. It reads two KV keys and pings the database
# only inside the published opening-hours windows or after recent signed-in activity; anything in doubt
# skips. Three triggers per environment, 12 across the four deployed environments (8 were live before
# #1491, so this account's limit is above the Workers Free plan's 5).
[triggers]
crons = ["*/15 * * * *", "0 3 * * *", "*/4 * * * *"]

# LOCAL SIMULATION ONLY. `wrangler dev` simulates this namespace on disk; no
# deploy reads it, because both deploy workflows pass `--env` and kv_namespaces
# is not inherited by an environment. The id is a placeholder, not a real
# namespace.
[[kv_namespaces]]
binding = "JOB_SIGNALS"
id = "local-job-signals"

# ---- Staging -------------------------------------------------------------
[env.staging]
name = "aheed-scheduler-staging"

[env.staging.triggers]
crons = ["*/15 * * * *", "0 3 * * *", "*/4 * * * *"]

# #1324/#1325 — JOB_SIGNALS for staging: KV namespace `aheed-jobs-staging` in the Merqify account
# (created 2026-10-31). The SAME id is in both this file and the other wrangler.toml.
[[env.staging.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "20aab8dee7f342809679d36f1d96fc6c"

[env.staging.vars]
APP_BASE_URL = "https://aheed-staging.merqify.com"

# ---- Production ----------------------------------------------------------
[env.production]
name = "aheed-scheduler-production"

[env.production.triggers]
crons = ["*/15 * * * *", "0 3 * * *", "*/4 * * * *"]

# #1324/#1325 — JOB_SIGNALS for production: KV namespace `aheed-jobs-production` in the Merqify account
# (created 2026-10-31). The SAME id is in both this file and the other wrangler.toml.
[[env.production.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "ba3dd6efb50445bc9cf856664fe6c1c5"

[env.production.vars]
APP_BASE_URL = "https://aheed.merqify.com"

# ---- Aheed Food Centre Dedicated Cell (Staging) -------------------------
# #1331 — Dedicated scheduler for Aheed Food Centre
[env.afc-staging]
name = "afc-scheduler-staging"

[env.afc-staging.triggers]
crons = ["*/15 * * * *", "0 3 * * *", "*/4 * * * *"]

# #1491 — the AFC cell's OWN namespace (afc-jobs-staging). It had reused the platform staging id, so the
# two cells overwrote each other's job markers and warm-up schedule. Same id in both wrangler.toml files.
[[env.afc-staging.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "9b5c84f21e294e1ca00b78bb1af62328"

[env.afc-staging.vars]
APP_BASE_URL = "https://staging.aheedfoodcentre.co.uk"

# ---- Aheed Food Centre Dedicated Cell (Production) ----------------------
# #1331 — Dedicated scheduler for Aheed Food Centre
[env.afc-production]
name = "afc-scheduler-production"

[env.afc-production.triggers]
crons = ["*/15 * * * *", "0 3 * * *", "*/4 * * * *"]

# #1491 — the AFC cell's OWN namespace (afc-jobs-production); see afc-staging above.
[[env.afc-production.kv_namespaces]]
binding = "JOB_SIGNALS"
id = "21b5000fa6c34de09e644599d3d103f7"

[env.afc-production.vars]
APP_BASE_URL = "https://www.aheedfoodcentre.co.uk"

# NOTE: JOB_INVOCATION_TOKEN is NOT set here. It is a runtime secret and must be
# set per environment, on BOTH this Worker and the application Worker, with the
# SAME value:
#   wrangler secret put JOB_INVOCATION_TOKEN --config workers/scheduler/wrangler.toml --env <env>
#   wrangler secret put JOB_INVOCATION_TOKEN --env <env>
